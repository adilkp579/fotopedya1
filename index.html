        <div class="avatar-wrap">
          <img class="avatar" id="pgeAvatarImg" src="${overrides.avatarUrl||ev.avatar}" width="64" height="64" alt="">
          <button class="photo-edit-btn avatar-edit-btn" id="pgeAvatarEditBtn" aria-label="Change profile photo" style="width:24px;height:24px;">${ICON.camera}</button>
        </div>
      </div>
      <h2 style="font-size:clamp(18px,5vw,22px); margin-top:12px;">${ev.name} ${isDemo?'<span class="badge-role" style="margin-left:6px;">Demo</span>':''}</h2>
      <p style="color:var(--text-muted); font-size:13.5px;">${ev.studio||''} · expires ${ev.expiry}</p>
      ${isDemo?`<p style="font-size:12px; color:var(--text-dim); margin-top:6px;">This is the bundled sample event — uploads and deletes here are just for trying things out.</p>`:''}
      <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
        <button class="btn btn-gold btn-sm" id="evQrBtn">${ICON.qr} Event QR</button>
        <button class="btn btn-ghost btn-sm" id="evUploadBtn">${ICON.camera} Upload Photos</button>
        <a href="#/event/${ev.id}" class="btn btn-ghost btn-sm">View public page</a>
      </div>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none;">
      <div id="uploadZone" style="display:none; margin-top:18px;">
        <div class="card" style="padding:16px;">
          <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:8px;"><span id="upLabel">Uploading…</span><span class="mono" id="upPct">0%</span></div>
          <div class="progressbar"><div class="fill" id="upFill" style="width:0%;"></div></div>
        </div>
      </div>
      <div class="divider"></div>
      <h3 style="font-size:16px; margin-bottom:12px;">Gallery (<span id="pgCount">0</span>)</h3>
      <div class="photo-grid" id="pgGrid"></div>
    </div>`);
    wrap.appendChild(body);

    wrap.querySelector('#pgeCoverEditBtn').addEventListener('click', ()=>{
      pickImage(async file=>{
        const dataUrl = await setSharedImage('img:event:cover:'+ev.id, file);
        wrap.querySelector('#pgeCoverImg').src = dataUrl;
        toast('Cover photo updated');
      });
    });
    body.querySelector('#pgeAvatarEditBtn').addEventListener('click', ()=>{
      pickImage(async file=>{
        const dataUrl = await setSharedImage('img:event:avatar:'+ev.id, file);
        body.querySelector('#pgeAvatarImg').src = dataUrl;
        toast('Profile photo updated');
      });
    });

    async function drawGallery(){
      const grid = body.querySelector('#pgGrid');
      const photos = await getEventPhotos(ev);
      body.querySelector('#pgCount').textContent = photos.length;
      grid.innerHTML = '';
      if(photos.length===0){
        grid.appendChild(h(`<div class="empty" style="grid-column:1/-1;"><p>No photos uploaded yet.</p></div>`));
        return;
      }
      renderInfiniteGrid(grid, photos, p=>{
        const card = h(`<div class="photo-card">
          ${p.type==='video' ? `<div class="tag">${ICON.video}</div>` : ''}
          <img src="${p.thumb}" loading="lazy">
          <button class="mini-btn" data-act="delphoto" style="position:absolute; top:8px; right:8px;">${ICON.trash}</button>
          ${p.source==='upload' ? `
          <div class="actions" style="justify-content:space-between; align-items:center; padding:8px 10px;">
            <span style="font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:999px; background:rgba(10,9,8,0.6); color:#fff;">${p.isPublic?'Public':'Private'}</span>
            <div class="switch ${p.isPublic?'on':''}" data-id="${p.id}"></div>
          </div>` : ''}
        </div>`);
        card.querySelector('img').addEventListener('click', ()=>openLightbox(p));
        card.querySelector('.switch')?.addEventListener('click', async e=>{
          e.stopPropagation();
          const next = !p.isPublic;
          p.isPublic = next;
          e.currentTarget.classList.toggle('on');
          e.currentTarget.parentElement.querySelector('span').textContent = next?'Public':'Private';
          await UploadsDB.setPublic(p.id, next);
          toast(next?'Visible to guests':'Hidden from guests');
        });
        card.querySelector('[data-act=delphoto]').addEventListener('click', e=>{
          e.stopPropagation();
          showConfirmSheet({
            title:'Delete this photo?',
            message:'This removes the photo from the event gallery for all guests on this device. This cannot be undone.',
            confirmLabel:'Delete Photo',
            onConfirm: async ()=>{
              if(p.source==='upload') await UploadsDB.remove(p.id);
              else await Store.deleteDemoPhoto(p.id);
              if(!isDemo){ ev.mediaCount = Math.max(0,(ev.mediaCount||0)-1); await Store.saveEvent(ev); }
              toast('Photo deleted');
              drawGallery();
            }
          });
        });
        return card;
      }, 10);
    }
    drawGallery();

    body.querySelector('#evQrBtn').addEventListener('click', ()=>showQRSheet(location.origin+location.pathname+'#/event/'+ev.id, ev.name+' QR'));
    const fileInput = body.querySelector('#fileInput');
    body.querySelector('#evUploadBtn').addEventListener('click', ()=>fileInput.click());
    fileInput.addEventListener('change', async ()=>{
      const files = [...fileInput.files];
      if(files.length===0) return;
      const zone = body.querySelector('#uploadZone'); zone.style.display='block';
      const fill = body.querySelector('#upFill'); const pct = body.querySelector('#upPct'); const label = body.querySelector('#upLabel');
      for(let i=0;i<files.length;i++){
        const f = files[i];
        label.textContent = `Uploading ${f.name}`;
        await UploadsDB.add({
          id: 'up_'+ev.id+'_'+Date.now()+'_'+i,
          eventId: ev.id,
          type: f.type.startsWith('video')?'video':'photo',
          blob: f, ts: Date.now()
        });
        const p = Math.round(((i+1)/files.length)*100);
        fill.style.width = p+'%'; pct.textContent = p+'%';
      }
      ev.mediaCount = (ev.mediaCount||0) + files.length;
      if(!isDemo) await Store.saveEvent(ev);
      toast(`${files.length} file${files.length>1?'s':''} uploaded`);
      fileInput.value = '';
      setTimeout(()=>{ zone.style.display='none'; }, 900);
      drawGallery();
    });
  })();

  return wrap;
}

function ViewCreateEvent(){
  const wrap = h(`<div class="fade-in container" style="padding-top:26px; max-width:520px;">
    <a href="#/photographer" class="btn btn-ghost btn-sm" style="margin-bottom:16px;">&larr; Cancel</a>
    <h2 style="font-size:clamp(19px,5vw,24px);">Create Event</h2>
    <p style="color:var(--text-muted); font-size:13.5px; margin-top:6px; margin-bottom:22px;">Set up a new gallery with its own QR code.</p>

    <div class="cover-wrap" id="ceCoverWrap" style="height:130px;">
      <img id="ceCoverPreview" src="https://picsum.photos/seed/newevent/1200/500" alt="" style="opacity:0.55;">
      <button class="photo-edit-btn cover-edit-btn" type="button" id="ceCoverBtn">${ICON.camera} <span style="font-size:11px; margin-left:4px;">Cover</span></button>
    </div>
    <div class="profile-head" style="margin-top:-30px;">
      <div class="avatar-wrap">
        <img class="avatar" id="ceAvatarPreview" width="64" height="64" src="https://picsum.photos/seed/newevent2/200/200" alt="" style="opacity:0.55;">
        <button class="photo-edit-btn avatar-edit-btn" type="button" id="ceAvatarBtn" style="width:24px;height:24px;">${ICON.camera}</button>
      </div>
      <p style="font-size:12px; color:var(--text-dim); padding-bottom:8px;">Tap to set a cover & profile photo (optional)</p>
    </div>

    <form id="ceForm" style="margin-top:14px;">
      <div class="field"><label>Event Name</label><input required name="name" placeholder="Adil & Fathima Wedding"></div>
      <div class="field"><label>Event Display Name</label><input name="display" placeholder="Ambro Photography"></div>
      <div class="field"><label>Description (optional)</label><textarea name="desc" rows="3" placeholder="Capturing your beautiful moments."></textarea></div>
      <div class="field-row">
        <div class="field"><label>Phone</label><input name="phone" placeholder="+919876543210"></div>
        <div class="field"><label>WhatsApp</label><input name="whatsapp" placeholder="919876543210"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Event Date</label><input type="date" name="date"></div>
        <div class="field"><label>Expiry</label>
          <select name="expiry">
            <option value="1">1 Day</option><option value="3">3 Days</option>
            <option value="5">5 Days</option><option value="7" selected>7 Days</option>
            <option value="custom">Custom</option>
          </select>
        </div>
      </div>
      <button class="btn btn-gold btn-block" type="submit" style="margin-top:8px;">Create Event & Generate QR</button>
    </form>
  </div>`);

  let coverFile = null, avatarFile = null;
  wrap.querySelector('#ceCoverBtn').addEventListener('click', ()=>{
    pickImage(file=>{
      coverFile = file;
      wrap.querySelector('#ceCoverPreview').src = URL.createObjectURL(file);
      wrap.querySelector('#ceCoverPreview').style.opacity = '1';
    });
  });
  wrap.querySelector('#ceAvatarBtn').addEventListener('click', ()=>{
    pickImage(file=>{
      avatarFile = file;
      wrap.querySelector('#ceAvatarPreview').src = URL.createObjectURL(file);
      wrap.querySelector('#ceAvatarPreview').style.opacity = '1';
    });
  });

  wrap.querySelector('#ceForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const id = (fd.get('name')||'event').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Math.random().toString(36).slice(2,6);
    const ev = {
      id, name: fd.get('name'), studio: fd.get('display')||'', tagline: fd.get('desc')||'',
      date: fd.get('date')||new Date().toISOString().slice(0,10),
      expiry: fd.get('expiry')==='custom' ? 'custom' : (new Date(Date.now()+ (+fd.get('expiry')||7)*86400000)).toISOString().slice(0,10),
      cover: `https://picsum.photos/seed/${id}cover/1200/700`, avatar: `https://picsum.photos/seed/${id}avatar/200/200`,
      phone: fd.get('phone')||'', whatsapp: fd.get('whatsapp')||'', mediaCount: 0
    };
    await Store.addEvent(ev);
    if(coverFile) await setSharedImage('img:event:cover:'+id, coverFile);
    if(avatarFile) await setSharedImage('img:event:avatar:'+id, avatarFile);
    toast('Event created');
    location.hash = '#/photographer/'+id;
  });
  return wrap;
}
</script>
</body>
</html>
